<!DOCTYPE html>

<head>

<title>Udhëzuesit e laboratorëve · Blockchain Fundamentals</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--surf:#111b2e;--ink:#e2e8f0;--mut:#94a3b8;--line:#22304a;--acc:#f59e0b;--accbg:#3a2a07;--teal:#2dd4bf;--code:#050a14;--warn:#3b0f1a;--warnink:#fda4af}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--surf:#111b2e;--ink:#e2e8f0;--mut:#94a3b8;--line:#22304a;--acc:#f59e0b;--accbg:#3a2a07;--teal:#2dd4bf;--code:#050a14;--warn:#3b0f1a;--warnink:#fda4af}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:28px 20px;border-right:1px solid var(--line)}
nav h1{font-size:21px;margin-bottom:4px}nav p{margin:0 0 20px;color:var(--mut);font-size:15px}
nav a{display:block;padding:10px 12px;margin-bottom:4px;border-radius:8px;color:var(--ink);text-decoration:none;border-left:4px solid transparent}
nav a small{display:block;color:var(--mut);font-size:13px}
nav a:hover{background:var(--surf)}nav a[aria-current]{background:var(--accbg);border-left-color:var(--acc)}
nav a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);width:0}
main{padding:36px clamp(18px,5vw,56px) 80px;max-width:860px}
main h2{font-size:clamp(26px,4vw,36px)}
.goal{color:var(--mut);margin:8px 0 22px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:0 0 18px}

.warn{background:var(--warn);color:var(--warnink);border-color:transparent}

.step input{width:22px;height:22px;margin-top:4px;accent-color:var(--teal)}
.step h3{font-size:19px;font-family:system-ui,sans-serif;font-weight:650}
.step.done h3{text-decoration:line-through;color:var(--mut)}
.step p{margin:4px 0 0;color:var(--mut)}
pre{position:relative;margin:12px 0 0;padding:14px 16px;background:var(--code);color:var(--codeink);border-radius:10px;overflow-x:auto;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre button{position:sticky;float:right;top:0;margin:-4px -6px 0 8px;padding:5px 11px;border:0;border-radius:6px;background:var(--acc);color:#0f172a;font:600 13px system-ui;cursor:pointer}
.res,.fail{margin-top:20px}.res{border-left:4px solid var(--teal)}.fail{border-left:4px solid var(--acc)}

.nav2{display:flex;justify-content:space-between;margin-top:32px;gap:12px}

.me{margin:0 0 18px;font-size:15px}.me input,.box input{width:100%;padding:8px 10px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.me button,.box button{margin:4px 6px 0 0;padding:6px 12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
button[aria-pressed=true]{background:var(--accbg)!important;border-color:var(--acc)!important}
.tm{font-variant-numeric:tabular-nums}
.sim{background:var(--code);color:var(--codeink);border-radius:12px;padding:18px;margin:18px 0;border:1px solid var(--line)}

.sim button:hover{border-color:#2dd4bf}.sim .feedback{min-height:26px;color:#fcd34d;font-weight:600}.sim .ok{color:#6ee7b7}
.challenge-meta{font-size:13px;color:#94a3b8}
/* Focused classroom interface */
.step{grid-template-columns:1fr;position:relative;padding:18px 0}.step.locked .step-body{filter:blur(5px);opacity:.5;pointer-events:none;user-select:none}.step.locked:after{content:'🔒 Përfundo hapin paraprak për ta zhbllokuar';display:block;color:var(--mut);font-size:14px}.step.done .step-body{opacity:.7}.step.done h3{text-decoration:none;color:var(--teal)}
.step-body{min-width:0}.step-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.done-btn{border:0!important;background:var(--teal)!important;color:#042f2e!important;font-weight:750!important;padding:9px 16px!important}.done-btn:disabled{opacity:.5;cursor:not-allowed}.help{margin:12px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surf)}.help summary{cursor:pointer;font-weight:650;color:var(--teal)}.help p{margin:8px 0 0;color:var(--mut)}
.timer-card{position:sticky;top:10px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border:2px solid #f59e0b;background:var(--surf);border-radius:12px;box-shadow:0 5px 20px #d9770622;margin:16px 0}.timer-card strong{color:#b45309;font-size:18px}.timer-card .tm{font-size:22px;font-weight:800;color:var(--ink)}
.challenge{margin:24px 0;background:var(--code);color:var(--codeink);border-radius:14px;padding:20px;border:1px solid #334155}.challenge h3{color:#f8fafc;font:700 20px system-ui;margin:0 0 5px}.challenge .q{margin:12px 0;color:#e2e8f0}.challenge .screen{white-space:pre-wrap;background:#050a14;padding:14px;border-radius:8px;color:#a7f3d0;font:14px/1.6 ui-monospace,monospace;min-height:80px}.challenge button{margin:5px 7px 5px 0;padding:9px 14px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#e2e8f0;font:inherit;cursor:pointer}.challenge button:hover{border-color:#2dd4bf}.challenge .feedback{min-height:26px;color:#fcd34d;font-weight:650}.challenge .feedback.ok{color:#6ee7b7}
.xp-pop{position:fixed;right:24px;top:90px;z-index:20;background:#f59e0b;color:#431407;border-radius:999px;padding:12px 18px;font-weight:900;box-shadow:0 8px 30px #0004;animation:xpFloat 1.5s ease-out forwards;pointer-events:none}@keyframes xpFloat{0%{opacity:0;transform:translateY(20px) scale(.75)}20%{opacity:1;transform:translateY(0) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1)}}
.profile input{margin:4px 0 10px}.profile label{display:block;font-size:13px;font-weight:700}.profile .hint{display:block;color:var(--mut);font-size:12px;margin-top:6px}
</style>
</head>

steps:[["Hash i një teksti","Krijo hash.py me këtë kod dhe ekzekutoje me {py} hash.py.","import hashlib\n\ndef h(x):\n    return hashlib.sha256(x.encode()).hexdigest()\n\nprint(h(\"Blockchain\"))\nprint(h(\"blockchain\"))"],

steps:[["Krijo Escrow.sol","Ngjit kodin.",SOL+"contract Escrow {\n    address public buyer;\n    address public seller;\n    bool public funded;\n    bool public released;\n\n    event Funded(address indexed buyer, uint256 amount);\n    event Released(address indexed seller, uint256 amount);\n\n    error NotBuyer();\n    error WrongState();\n\n    constructor(address _seller) {\n        buyer = msg.sender;\n        seller = _seller;\n    }\n\n    function deposit() external payable {\n        if (msg.sender != buyer) revert NotBuyer();\n        if (funded) revert WrongState();\n        funded = true;\n        emit Funded(msg.sender, msg.value);\n    }\n\n    function release() external {\n        if (msg.sender != buyer) revert NotBuyer();\n        if (!funded || released) revert WrongState();\n        released = true;\n        uint256 amount = address(this).balance;\n        (bool ok, ) = seller.call{value: amount}(\"\");\n        require(ok, \"Failed\");\n        emit Released(seller, amount);\n    }\n}"],
